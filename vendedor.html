<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DA RUA — Pedidos</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="logodarua.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202610282154">
</head>
<body>
  <section class="login" id="login">
    <form id="formLogin">
      <div class="logo-box"><img src="logodarua.png" alt="DA RUA"></div>
      <h1>Área do vendedor</h1>
      <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
      <p class="erro" id="erroLogin" hidden></p>
      <button class="btn primario largo" id="entrar">Entrar</button>
      <p class="dica">A senha é definida no script da planilha (Apps Script).</p>
    </form>
  </section>

  <div id="painel" hidden>
    <header class="topo painel-topo">
      <div class="wrap topo-in">
        <div style="display:flex;align-items:center">
          <a href="index.html" class="logo"><img src="logodarua.png" alt="DA RUA"></a>
          <span class="tag">Pedidos</span>
        </div>
        <nav>
          <a href="index.html" target="_blank">Ver loja ↗</a>
          <button id="sair">Sair</button>
        </nav>
      </div>
    </header>

    <main class="wrap" style="padding-top:24px">
      <div class="kpis" id="kpis"></div>
      <div class="barra">
        <input type="search" id="busca" placeholder="Buscar por nome, nº ou telefone...">
        <select id="filtroStatus" style="width:auto"></select>
        <span class="esp"></span>
        <button class="btn pequeno" id="atualizar">Atualizar</button>
      </div>
      <p class="dica" id="atualizadoEm" style="margin:-6px 0 14px"></p>
      <div class="pedidos" id="lista"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/config.js?v=202610282154"></script>
  <script src="js/data.js?v=202610282154"></script>
  <script src="js/vendedor.js?v=202610282154"></script>
</body>
</html>
